# DDIA 第二版导读：推送到 main 就部署到 https://t.miaowuao.cn/ddia/
# 前提：仓库 Secret DEPLOY_SSH_KEY 已由 ~/tutorials-deploy/scripts/new-deploy-key.sh 设置好。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: rsync 到腾讯云
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo 't.miaowuao.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKl8FY3IexI311v7HuYzX5Ja9bDz1LwzWU0qrm8etp05' > ~/.ssh/known_hosts

          # 服务器端用 rrsync 把这把钥匙限制在 /var/www/tutorials 内，所以目标路径是相对的 ddia/
          # 跨境线路偶尔会抖，失败重试两次。source/（原书材料）绝不能部署。
          for i in 1 2 3; do
            rsync -rlczi --delete --chmod=D755,F644 --timeout=60 \
              --exclude=/.git/ --exclude=/.github/ --exclude=/.gitignore \
              --exclude=/source/ --exclude=/tools/ --exclude=/AUTHORING.md --exclude=/NEXT_STEPS.md --exclude=/README.md \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20" \
              ./ deploy@t.miaowuao.cn:ddia/ && exit 0
            echo "第 $i 次失败，10 秒后重试"; sleep 10
          done
          exit 1
